# ISO 30414 — Production Docker Compose
# Usage:
#   1. Copy .env.example to .env and fill all values
#   2. docker compose -f docker-compose.production.yml up -d
#
# IMPORTANT:
#   - PostgreSQL is NOT exposed to the host network
#   - All secrets must come from environment variables (see .env.example)
#   - Replace nginx/nginx.prod.conf domain with your actual domain
#   - Set up TLS cert (e.g. certbot) before running

services:
  # ─── PostgreSQL (internal only) ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # NO port mapping — only reachable within Docker network
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      APP_URL: ${APP_URL}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      STORAGE_PATH: /app/storage
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - api_storage:/app/storage
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ─── Frontend ────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Reverse Proxy (HTTPS) ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro   # TLS certificates
      - nginx_logs:/var/log/nginx
    networks:
      - internal
      - external
    depends_on:
      - api
      - web

networks:
  internal:
    driver: bridge
    internal: true   # No direct internet access from internal network
  external:
    driver: bridge

volumes:
  pgdata:
  api_storage:
  nginx_logs:
