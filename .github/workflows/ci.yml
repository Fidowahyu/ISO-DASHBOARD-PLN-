name: CI — ISO 30414

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Server: type-check → test → build ────────────────────────────────────
  server:
    name: Server CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iso30414_test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: iso30414_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://iso30414_test:testpassword@localhost:5432/iso30414_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-not-real
      JWT_EXPIRES_IN: 1h
      APP_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push DB schema (test)
        run: npx prisma db push --skip-generate

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # ─── Client: lint → type-check → build ────────────────────────────────────
  client:
    name: Client CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api

  # ─── Security audit (non-blocking on known acceptable issues) ─────────────
  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high
        continue-on-error: true  # Review findings manually; don't auto-fail

      - name: Audit client dependencies
        working-directory: client
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
